<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body class="Cuerpo">
    <header>
        <!-- Logo principal de la empresa-->
        <div class="contenedor">
            <a href="../index.html"><img src="../imagenes/barberia.jpg" alt="Logo Luck"></a>
        </div>
        <h3 class="Marca" id="Marca">Barbería Luck</h3>

    </header>

    <!-- Formulario -->
    <h3 class=Marca>Recuperación de la contraseña</h3>
    <form class=formRegistro id="botonRecuperar">
        <label>Ingrese correo electrónico</label>
        <input type="text" id="email"> 
        <label>Contraseña nueva</label>
        <input type="password" id="newPass">

        <label>Confirmar contraseña nueva</label>
        <input type="password" id="confPass">

        <p>Te enviaremos un código de verificación al correo electrónico...</p>
        <label>Introduce tu código de verificación:</label>
        <input type="text" id="codVer">

        <button>Recuperar Contraseña</button>

    </form>

<script src="../js/recuperar_password.js"></script>
</body>

</html>
